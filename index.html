/* ===== v13: real 3D turn between the SIDE image and the FRONT image ===== */

   faster and softer spring. It is moved by: a gentle breeze that rolls along the rail, the rail/neighbours sliding
   (inertia), a finger/cursor brushing past, a tap (poke) and the turn to the front. Nothing is scripted — it is simulated. */
